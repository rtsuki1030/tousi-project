name = "tousi-ai-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Runs the AI trading tick every 15 minutes, independent of any browser tab.
# (Currently dormant on this account -- see .github/workflows/ai-tick.yml for
# the GitHub Actions trigger actually driving ticks. Kept in sync so that if
# Cloudflare's cron bug is ever fixed, it won't double the API call volume.)
[triggers]
# "0 12 * * *" (21:00 JST) sends the daily P&L report to Discord instead.
crons = ["*/15 * * * *", "0 12 * * *"]

# Created with `npx wrangler kv namespace create AI_KV` -- paste the real id
# it prints into the line below before deploying.
[[kv_namespaces]]
binding = "AI_KV"
id = "f92f1f58403e4c91873c2e6f4be0b7eb"
